<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Community development preview</title><link rel="stylesheet" href="/web/community.css"><style>:root{font-size:1px;color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#071016;color:#e3edf3;font:16px/1.5 system-ui}a{color:inherit;text-decoration:none}button{cursor:pointer}h1,h2,p{margin:0}.community-panel{position:fixed;left:3vw;top:60px;width:94vw;height:calc(100dvh - 80px);--condensed:system-ui}.community-scroll{inset:0}header.demo{padding:12px 3vw;display:flex;gap:20px;font-size:14px}.sr-only{position:absolute;clip:rect(0,0,0,0)}[hidden]{display:none!important}</style></head><body><header class="demo"><strong>LOCAL PREVIEW</strong><button data-account="author">Author</button><button data-account="reader">Reader</button><button data-account="staff">Staff</button><button data-account="">Guest</button></header><div class="scene-content"><main class="community-panel"><div class="community-scroll" data-community-root></div></main></div><script>window.__COMMUNITY_API__=location.origin+'/api/community';window.__COMMUNITY_REPO__='https://github.com/No-Vibe-No-Code/community-guides';</script><script type="module">
import '/web/community.js';
let dispose=()=>{};const scene=document.querySelector('.scene-content');
async function navigate(href,{historyNavigation=false}={}){if(!await GuideCommunity.beforeLeave())return;dispose();await GuideCommunity.prepare(scene,href);if(!historyNavigation)history.pushState(null,'',href);dispose=GuideCommunity.mount(scene);scene.dataset.sceneReady='true';scene.animate([{opacity:.2},{opacity:1}],{duration:240});}
window.GuideScene={navigate,replaceURL:href=>history.replaceState(null,'',href)};
document.addEventListener('click',async event=>{const account=event.target.closest('[data-account]');if(account){await fetch('/__demo/account?who='+account.dataset.account);location.reload();return;}const a=event.target.closest('a');if(a&&a.origin===location.origin&&a.pathname.startsWith('/community')){event.preventDefault();navigate(a.href);}});addEventListener('popstate',()=>navigate(location.href,{historyNavigation:true}));await navigate(location.href,{historyNavigation:true});
</script></body></html>
